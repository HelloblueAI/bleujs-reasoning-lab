# BleuJS Reasoning Lab — local development and CI config.
# Run: pnpm run worker:dev
#
# This file intentionally has no routes, KV IDs, or production settings.
# To deploy your own instance, copy wrangler.example.toml to
# wrangler.production.toml (gitignored) and fill in your values.
name = "bleujs-reasoning-lab"
main = "src/worker/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret vars. API keys go in .dev.vars locally (see .dev.vars.example).
[vars]
ENVIRONMENT = "development"

[observability]
enabled = true
head_sampling_rate = 1
