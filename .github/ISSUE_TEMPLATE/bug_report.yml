name: Bug report
description: Something broken in BleuJS Reasoning Lab (worker, API, eval, dashboard)
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If you meant to pick up a starter task, use an
        [open good first issue](https://github.com/HelloblueAI/bleujs-reasoning-lab/issues?q=is%3Aissue+is%3Aopen+label%3A%22good+first+issue%22) instead.
        Please report security issues privately per SECURITY.md, not here.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect vs what you saw?
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL or endpoint
      placeholder: https://agi.bleujs.org/reason
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: curl command, worker:dev steps, etc.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard / UI
        - API (/reason, /status, /capabilities, /eval)
        - Eval harness
        - Local dev (Wrangler)
        - CI / docs
        - Other
    validations:
      required: true
